<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA用設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4444">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1042/1042577.png">

    <title>TowerDungeon</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37; --hero-red: #ff4444; --hp-green: #2ecc71; --sp-cyan: #00d4ff; --bg-dark: #050508;
        }
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #e0e0e0; font-family: 'Noto Sans JP', sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        #game-screen {
            width: 100%; max-width: 600px; height: 100vh; background: var(--bg-dark);
            border: 3px solid var(--hero-red); display: flex; flex-direction: column; position: relative;
        }

        .header-bar {
            display: flex; justify-content: space-between; padding: 10px 15px;
            background: #1a0505; border-bottom: 2px solid var(--gold);
            font-size: 0.85em; color: var(--gold); font-family: 'Cinzel', serif;
        }

        .status-area { padding: 10px; background: #000; border-bottom: 1px solid #333; }
        .hero-card { background: rgba(30, 10, 10, 0.9); border: 2px solid var(--hero-red); padding: 10px; border-radius: 8px; }
        .hp-bar-outer { width: 100%; height: 10px; background: #222; border-radius: 5px; margin: 5px 0; overflow: hidden; }
        .hp-bar-inner { height: 100%; background: var(--hp-green); transition: width 0.3s; }
        .stat-grid-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.75em; color: #ccc; margin-top: 5px; }

        #arena { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #311 0%, #000 90%); position: relative; }
        .monster-sprite { font-size: 5rem; line-height: 1; margin-bottom: 10px; transition: transform 0.2s; }
        .monster-label { background: rgba(0,0,0,0.85); padding: 5px 15px; border-radius: 12px; border: 1px solid var(--hero-red); text-align: center; font-size: 0.8em; }

        #log { height: 100px; background: #000; border-top: 1px solid #333; padding: 10px; overflow-y: auto; font-size: 0.8em; line-height: 1.4; color: #ddd; }

        #action-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; background: #111; border-top: 2px solid var(--gold); height: 180px; overflow-y: auto; }
        .btn-cmd { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 0.85em; }
        .btn-cmd:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-cmd small { display: block; font-size: 0.75em; color: #aaa; margin-top: 2px; }

        .dmg-pop { position: absolute; font-size: 2.5rem; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: popUp 0.8s forwards; z-index: 100; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-80px); opacity: 0; } }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 500; }
        .modal { width: 90%; background: #1a0a0a; border: 2px solid var(--gold); padding: 15px; border-radius: 10px; text-align: center; max-height: 90%; overflow-y: auto;}
        .stat-upgrade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .save-controls { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #444; display: flex; gap: 5px; flex-wrap: wrap; }
        .btn-small { flex: 1; font-size: 10px; padding: 5px; background: #333; color: #ccc; border: 1px solid #555; cursor: pointer; }
        
        .shake { animation: shakeEffect 0.15s infinite; }
        @keyframes shakeEffect { 0% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); } }
    </style>
</head>
<body>

<div id="game-screen">
    <div class="header-bar">
        <span>Tower Dungeon</span>
        <span>FLOOR: <span id="ui-floor">1</span></span>
        <span style="color:#fc0">PTS: <span id="ui-pts">0</span></span>
    </div>

    <div class="status-area">
        <div class="hero-card">
            <div style="display:flex; justify-content:space-between">
                <span style="color:var(--hero-red); font-weight:bold;">HERO</span>
                <span style="color:var(--sp-cyan); font-weight:bold;">SP: <span id="ui-sp">10</span> / <span id="ui-msp">10</span></span>
            </div>
            <div class="hp-bar-outer"><div id="hp-bar" class="hp-bar-inner"></div></div>
            <div style="font-size:1em; font-weight:bold; text-align:right;"><span id="ui-hp">50</span> / <span id="ui-mhp">50</span></div>
            <div class="stat-grid-mini">
                <span>ATK: <b id="ui-atk">5</b></span>
                <span>DEF: <b id="ui-def">2</b></span>
                <span>Mult: <b id="ui-perma">1.0</b>x</span>
            </div>
        </div>
    </div>

    <div id="arena"></div>
    <div id="log"></div>
    <div id="action-panel"></div>

    <div id="overlay" class="overlay">
        <div id="modal-content" class="modal"></div>
    </div>
</div>

<script>
    // --- サービスワーカーの登録 ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log('SW Registered'));
    }

    const MONSTERS = ["💀","🐺","🕷️","👹","🐊","🔥","🐲","🦂","🌕","🧿","🦁","🌌"];
    const UNITS = ["", "K", "M", "B", "T", "Q", "P", "E", "Z", "Y"];
    const LOCAL_KEY = "tower_asc_hard_rebirth_local";

    const SKILL_DB = {
        5: { name: "諸刃の剣", desc: "SP 15 | ATK×4 / 自分20%ダメ", cost: 15, logic: (h,e)=>{ const d=h.atk*4; h.hp-=h.maxHp*0.2; return d; } },
        10: { name: "不動の構え", desc: "SP 20 | 次ターン被ダメ90%減/行動不可", cost: 20, logic: (h,e)=>{ state.hero.immovable = true; return 0; } },
        15: { name: "貫通の一撃", desc: "SP 25 | 盾無視 ATK×3ダメ", cost: 25, logic: (h,e)=>h.atk*3, ignoreShield: true },
        20: { name: "集中", desc: "SP 30 | 次のスキル威力3.5倍", cost: 30, logic: (h,e)=>{ state.hero.focus = true; return 0; } },
        25: { name: "不屈の精神", desc: "SP 40 | HP全快 / 防御×10ダメ", cost: 40, logic: (h,e)=>{ h.hp=h.maxHp; return h.def*10; } }
    };

    let state = {
        floor: 1, pts: 0, sp: 10, turn: 0,
        hero: { hp: 50, maxHp: 50, atk: 5, def: 2, msp: 10, immovable: false, focus: false, perma: 1.0 },
        upgrades: { hp:0, atk:0, def:0, sp:0 },
        isBusy: false
    };

    function saveLocal() {
        const data = { f: state.floor, p: state.pts, h: state.hero, u: state.upgrades };
        localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
    }

    function loadLocal() {
        const saved = localStorage.getItem(LOCAL_KEY);
        if (saved) applyData(JSON.parse(saved));
    }

    function exportCode() {
        const data = { f: state.floor, p: state.pts, h: state.hero, u: state.upgrades };
        const code = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        prompt("セーブコード（コピーしてください）：", code);
    }

    function importCode() {
        const code = prompt("セーブコードを貼り付けてください：");
        if (code) {
            try {
                const decoded = decodeURIComponent(escape(atob(code)));
                applyData(JSON.parse(decoded));
                saveLocal();
                location.reload();
            } catch (e) { alert("無効なコードです。"); }
        }
    }

    function applyData(data) {
        state.floor = data.f; state.pts = data.p; state.hero = data.h; state.upgrades = data.u;
        state.hero.hp = state.hero.maxHp; state.sp = state.hero.msp;
    }

    function format(n) {
        if (n < 1000) return Math.floor(n);
        const i = Math.floor(Math.log(n) / Math.log(1000));
        return (n / Math.pow(1000, i)).toFixed(2) + UNITS[i];
    }

    function addLog(t, c="#ccc") {
        const l = document.getElementById('log');
        l.innerHTML = `<div style="color:${c}">▸ ${t}</div>` + l.innerHTML;
        l.scrollTop = 0;
    }

    function getCost(type) { return 1 + Math.floor(state.upgrades[type] / 10); }

    function updateUI() {
        const h = state.hero;
        document.getElementById('ui-hp').innerText = format(h.hp);
        document.getElementById('ui-mhp').innerText = format(h.maxHp);
        document.getElementById('hp-bar').style.width = Math.max(0, (h.hp / h.maxHp * 100)) + "%";
        document.getElementById('ui-sp').innerText = format(state.sp);
        document.getElementById('ui-msp').innerText = format(h.msp);
        document.getElementById('ui-atk').innerText = format(h.atk);
        document.getElementById('ui-def').innerText = format(h.def);
        document.getElementById('ui-floor').innerText = state.floor;
        document.getElementById('ui-pts').innerText = format(state.pts);
        document.getElementById('ui-perma').innerText = h.perma.toFixed(1);
        
        const panel = document.getElementById('action-panel');
        panel.innerHTML = "";
        const baseActions = [{id:'atk', name:'通常斬撃', cost:0, desc:'標準攻撃'}, {id:'def', name:'鉄壁防御', cost:0, desc:'被ダメ大幅減'}];
        let skills = [];
        Object.keys(SKILL_DB).forEach(k => { if(state.floor > k) skills.push({id:'s_'+k, ...SKILL_DB[k]}); });

        baseActions.concat(skills).forEach(s => {
            const b = document.createElement('button');
            b.className = 'btn-cmd';
            b.disabled = state.isBusy || state.sp < s.cost;
            b.onclick = () => handleAction(s.id, s.cost);
            b.innerHTML = `${s.name}<small>${s.desc}</small>`;
            panel.appendChild(b);
        });
    }

    function spawn() {
        const isBoss = state.floor % 5 === 0;
        const scale = Math.pow(1.3, state.floor - 1);
        state.enemy = {
            hp: Math.floor(20 * scale * (isBoss ? 6 : 1)),
            atk: Math.floor(6 * scale),
            icon: isBoss ? "🏮" : MONSTERS[Math.min(MONSTERS.length-1, Math.floor(state.floor/8))],
            shield: (state.floor >= 15 && state.floor % 5 === 0)
        };
        state.enemy.maxHp = state.enemy.hp;
        state.turn = 0;
        document.getElementById('arena').innerHTML = `<div id="m-unit"><div class="monster-sprite">${state.enemy.icon}</div><div class="monster-label">HP: ${format(state.enemy.hp)}<br>${state.enemy.shield?'[SHIELD ACTIVE]':''}</div></div>`;
        updateUI();
    }

    async function handleAction(id, cost) {
        if (state.isBusy) return;
        state.isBusy = true;
        state.sp -= cost;
        state.turn++;
        state.defending = (id === 'def');
        let dmg = 0;

        if (id === 'atk') {
            dmg = state.hero.atk;
            hit(dmg, "勇者の攻撃！");
        } else if (id === 'def') { addLog("防御姿勢。"); }
        else if (id.startsWith('s_')) {
            const s = SKILL_DB[id.split('_')[1]];
            dmg = s.logic(state.hero, state.enemy);
            if (state.hero.focus && dmg > 0) { dmg *= 3.5; state.hero.focus = false; addLog("集中！", "#fc0"); }
            if (dmg > 0) hit(dmg, `${s.name}！！`, s.ignoreShield);
        }

        await wait(600);
        if (state.hero.hp <= 0) { die(); return; }
        if (state.enemy.hp <= 0) { win(); }
        else { 
            await enemyTurn(state.hero.immovable);
            state.hero.immovable = false;
            state.isBusy = false;
            updateUI();
        }
    }

    function hit(d, t, ignore=false) {
        if (state.enemy.shield && !ignore) {
            const threshold = state.enemy.maxHp * 0.1;
            if (d < threshold) { d = 1; addLog("無効化！", "#aaa"); }
        }
        state.enemy.hp -= d;
        addLog(`${t} ${format(d)}ダメ`);
        const p = document.createElement('div'); p.className='dmg-pop'; p.innerText=format(d);
        document.getElementById('arena').appendChild(p);
        setTimeout(()=>p.remove(), 800);
        document.getElementById('m-unit').classList.add('shake');
        setTimeout(()=>document.getElementById('m-unit').classList.remove('shake'), 200);
    }

    async function enemyTurn(isImm) {
        let e = state.enemy;
        let rawAtk = e.atk;
        if (state.floor % 5 === 0 && (state.turn % 3 === 0)) { rawAtk *= 2.5; addLog("殺気！", "red"); }

        let dmg = rawAtk * (100 / (100 + state.hero.def));
        if (isImm) dmg *= 0.1;
        else if (state.defending) dmg *= 0.35;

        state.hero.hp = Math.max(0, state.hero.hp - dmg);
        addLog(`${e.icon}の攻撃！ ${format(dmg)}ダメ！`, "#f44");
        updateUI();
        if (state.hero.hp <= 0) die();
        await wait(400);
    }

    function win() {
        const gain = Math.floor(state.floor * 10 * state.hero.perma);
        state.pts += gain;
        addLog(`${state.floor}F 突破！`, "#ff0");
        state.sp = Math.min(state.hero.msp, state.sp + state.hero.msp * 0.1);
        state.floor++;
        saveLocal();
        setTimeout(showStatMenu, 600);
    }

    function die() {
        addLog("敗北。1階へ戻る。", "red");
        setTimeout(() => {
            state.floor = 1; state.hero.hp = state.hero.maxHp; state.sp = state.hero.msp;
            state.isBusy = false; saveLocal(); showStatMenu();
        }, 1200);
    }

    function showStatMenu() {
        document.getElementById('overlay').style.display = 'flex';
        const modal = document.getElementById('modal-content');
        modal.innerHTML = `<h2>能力強化 (PTS:${format(state.pts)})</h2>
        <div class="stat-upgrade-grid">
            <button class="btn-cmd" onclick="upgrade('hp')">HP+10<br><small>Cost: ${getCost('hp')}</small></button>
            <button class="btn-cmd" onclick="upgrade('atk')">ATK+1<br><small>Cost: ${getCost('atk')}</small></button>
            <button class="btn-cmd" onclick="upgrade('def')">DEF+1<br><small>Cost: ${getCost('def')}</small></button>
            <button class="btn-cmd" onclick="upgrade('sp')">SP+2<br><small>Cost: ${getCost('sp')}</small></button>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-cmd" onclick="prestige()" style="flex:1; border-color:#f0f; text-align:center;">転生</button>
            <button class="btn-cmd" onclick="startFloor()" style="flex:1; border-color:#0f0; text-align:center;">次へ</button>
        </div>
        <div class="save-controls">
            <button class="btn-small" onclick="exportCode()">コード発行</button>
            <button class="btn-small" onclick="importCode()">コード入力</button>
            <button class="btn-small" onclick="resetAll()">全消去</button>
        </div>`;
    }

    function upgrade(t) {
        let cost = getCost(t);
        if (state.pts < cost) return;
        state.pts -= cost; state.upgrades[t]++;
        if(t==='hp') state.hero.maxHp += 10;
        if(t==='atk') state.hero.atk += 1;
        if(t==='def') state.hero.def += 1;
        if(t==='sp') state.hero.msp += 2;
        state.hero.hp = state.hero.maxHp;
        saveLocal(); showStatMenu(); updateUI();
    }

    function prestige() {
        if (state.floor < 10) return alert("10F到達が必要。");
        if (!confirm("転生しますか？")) return;
        state.hero.perma += 0.5; state.floor = 1;
        state.hero.maxHp = 50; state.hero.atk = 5; state.hero.def = 2; state.hero.msp = 10;
        state.upgrades = { hp:0, atk:0, def:0, sp:0 };
        state.pts = 0; state.hero.hp = 50; state.sp = 10;
        saveLocal(); showStatMenu(); updateUI();
    }

    function startFloor() {
        state.hero.hp = state.hero.maxHp;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('log').innerHTML = "";
        state.isBusy = false; spawn();
    }

    function resetAll() { if(confirm("データを消去しますか？")) { localStorage.removeItem(LOCAL_KEY); location.reload(); } }
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    loadLocal();
    spawn();
</script>
</body>
</html>
